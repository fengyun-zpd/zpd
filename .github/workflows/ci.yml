name: CI

on:
  push:
    branches: [main]
  pull_request:

# 无真实密钥环境可运行：CI 不配置 LLM/Langfuse 凭证，后端以 OFFLINE 模式测试，
# 不调用外部模型；e2e 需要 Docker 完整栈，默认不在此运行（README 给出本地运行方式）。
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: stockmind
          POSTGRES_PASSWORD: stockmind
          POSTGRES_DB: stockmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      # 迁移/种子验证与 pytest 共用同一测试库（alembic 与 app.db 都读 POSTGRES_DSN）
      POSTGRES_DSN: postgresql+psycopg://stockmind:stockmind@127.0.0.1:5432/stockmind_test
      TEST_POSTGRES_DSN: postgresql+psycopg://stockmind:stockmind@127.0.0.1:5432/stockmind_test
      EMBEDDING_ENABLED: "false"
      CHECKPOINTER_BACKEND: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 安装依赖（requirements.lock 约束，可复现）
        run: |
          cd backend
          pip install -e ".[dev]" --constraint requirements.lock
      - name: 锁文件一致性检查（base+dev 与 rag 锁文件均存在且无 CUDA 依赖）
        run: |
          cd backend
          test -f requirements.lock && test -f requirements-rag.lock
          if grep -qE '^(nvidia-|triton|cuda-)' requirements-rag.lock; then
            echo "::error::requirements-rag.lock 含 CUDA 依赖（应仅 CPU torch）"; exit 1
          fi
          grep -qE '^torch==2\.6\.0\+cpu' requirements-rag.lock || { echo "::error::rag lock 未固定 CPU torch"; exit 1; }
          echo "锁文件检查通过"
      - name: 静态检查（Ruff / 格式 / Mypy）
        run: |
          cd backend
          ruff check app tests
          ruff format --check app tests
          mypy app
      - name: 迁移与种子验证（干净测试库，幂等；迁移内自动启用 pgvector 扩展）
        run: |
          cd backend
          alembic upgrade head
          python -m app.seed.seed
          python -m app.seed.seed
          alembic upgrade head
      - name: 单元/性质/集成测试（OFFLINE 模式，无真实密钥）
        run: |
          cd backend
          # pytest fixture 会重建 schema（create_all + seed），与迁移验证互不干扰
          pytest tests/ -q -m "not e2e"
      - name: 密钥泄露防护（不得存在密钥内容；只报文件名，不输出匹配内容）
        run: |
          # 只列出命中文件名，绝不打印匹配行内容（避免把疑似密钥写进日志）
          if grep -rlE --include="*.py" --include="*.ts" --include="*.tsx" --include="*.json" --include="*.yml" --include="*.yaml" --include="*.sh" --include="*.md" -E 'sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|gh[pousr]_[A-Za-z0-9]{20,}' backend frontend .github *.md docker-compose.yml 2>/dev/null; then
            echo "::error::检测到疑似密钥（文件名已在上方列出，内容未输出）"; exit 1
          fi
          echo "密钥扫描通过（未发现疑似密钥）"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 构建前端
        run: |
          cd frontend
          npm install
          npm run build

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配置检查（无 .env 时 env_file required:false 必须可解析）
        run: |
          docker compose config --quiet
          docker compose config --services
      - name: 构建容器（可选检查：验证 Dockerfile 可构建，无 .env 以 OFFLINE 配置）
        run: |
          docker compose build --progress=plain
